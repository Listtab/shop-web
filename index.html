<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

<title>商品展示</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    color: #2C2B29; background: #EDEBE8;
  }

  /* 居中内容列（手机上自然满宽，电脑上收成一条） */
  .app { max-width: 540px; margin: 0 auto; min-height: 100vh;
         background: #F5F3F0; position: relative; }

  /* ===== 顶部轮播 ===== */
  .banner { position: relative; height: 172px; overflow: hidden; background: #8B2E2E; }
  .banner-track { display: flex; height: 100%; transition: transform .45s ease; }
  .slide { min-width: 100%; height: 100%; position: relative; display: flex;
           flex-direction: column; justify-content: flex-end; padding: 0 20px 22px; color: #fff; }
  .slide .s-title { font-size: 20px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .slide .s-sub { font-size: 13px; margin-top: 6px; opacity: .92; text-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .banner-dots { position: absolute; bottom: 12px; right: 18px; display: flex; gap: 6px; z-index: 5; }
  .banner-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .banner-dots i.on { background: #fff; width: 16px; border-radius: 4px; }

  /* ===== 店铺名片卡（叠加轮播上） ===== */
  .card-wrap { margin: -50px 16px 0; position: relative; z-index: 10; }
  .profile-card { background: #fff; border-radius: 16px; padding: 16px;
                  box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .pc-top { display: flex; align-items: center; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            background: #8B2E2E; color: #fff; font-size: 22px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pc-main { margin-left: 12px; flex: 1; min-width: 0; }
  .pc-name { font-size: 18px; font-weight: 700; }
  .pc-tag { font-size: 12px; color: #9A938A; margin-top: 3px; }
  .pc-row { display: flex; align-items: center; margin-top: 12px; background: #F6F4F1;
            border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .pc-label { color: #9A938A; width: 56px; flex-shrink: 0; }
  .pc-value { flex: 1; color: #2C2B29; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-act { color: #185FA5; flex-shrink: 0; margin-left: 8px; cursor: pointer; }
  .pc-act.accent { color: #8B2E2E; }

  /* ===== 公告 ===== */
  .notice { margin: 12px 16px 0; background: #FFF7E8; color: #854F0B; font-size: 12px;
            padding: 9px 12px; border-radius: 9px; display: flex; gap: 6px; align-items: center; }

  /* ===== 分类 ===== */
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 4px; margin-top: 4px;
          scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex-shrink: 0; width: 64px; text-align: center; cursor: pointer; padding: 4px 0;
         border-radius: 12px; transition: .15s; }
  .cat .c-ic { width: 50px; height: 50px; margin: 0 auto; border-radius: 16px; background: #fff;
               font-size: 24px; line-height: 50px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); overflow: hidden; }
  .cat .c-ic img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; }
  .cat .c-nm { display: block; font-size: 12px; color: #6B675F; margin-top: 6px; }
  .cat.active .c-ic { background: #8B2E2E; }
  .cat.active .c-nm { color: #8B2E2E; font-weight: 600; }

  /* ===== 搜索 ===== */
  .search { margin: 12px 16px 0; }
  .search input { width: 100%; background: #fff; border: none; border-radius: 20px;
                  padding: 11px 16px; font-size: 16px; color: #2C2B29;
                  box-shadow: 0 1px 6px rgba(0,0,0,.04); }
  .search input:focus { outline: none; }

  /* ===== 商品网格 ===== */
  .sec-title { margin: 18px 16px 0; font-size: 15px; font-weight: 700; }
  .grid { display: flex; flex-wrap: wrap; padding: 12px 10px 4px; }
  .goods { width: 50%; padding: 6px 6px 8px; cursor: pointer; }
  .g-inner { background: #fff; border-radius: 13px; overflow: hidden;
             box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .g-img { width: 100%; height: 150px; position: relative; display: flex;
           align-items: center; justify-content: center; background: #E7DEDC; color: #fff; font-size: 34px; }
  .g-img img { width: 100%; height: 100%; object-fit: cover; }
  .g-tags { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; }
  .g-tags span { background: rgba(0,0,0,.45); color: #fff; font-size: 10px;
                 padding: 2px 6px; border-radius: 6px; }
  .g-body { padding: 9px 10px 11px; }
  .g-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .g-cat { display: inline-block; font-size: 11px; color: #8B2E2E; background: #FBEFEF;
           border-radius: 5px; padding: 2px 6px; margin-top: 6px; }
  .g-foot { margin-top: 8px; display: flex; align-items: baseline; }
  .price { color: #8B2E2E; font-size: 17px; font-weight: 700; }
  .price.ask { font-size: 15px; }
  .price .cny { font-size: 12px; }
  .unit { color: #9A938A; font-size: 11px; margin-left: 2px; }
  .list-end { text-align: center; color: #B4B2A9; font-size: 12px; padding: 16px 0 80px; }
  .empty { text-align: center; color: #9A938A; font-size: 13px; padding: 40px 20px; }

  /* ===== 联系页 ===== */
  .page-contact { background: #F5F3F0; padding: 8px 0 80px; }
  .contact-card { margin: 12px 16px; background: #fff; border-radius: 16px; padding: 18px;
                  box-shadow: 0 3px 12px rgba(0,0,0,.05); }
  .contact-head { display: flex; align-items: center; }
  .contact-head .avatar { width: 64px; height: 64px; font-size: 26px; }
  .contact-head .pc-name { font-size: 20px; }
  .contact-line { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid #F0EEEA; font-size: 14px; }
  .contact-line:last-child { border-bottom: none; }
  .contact-line .cl-ic { width: 30px; text-align: center; font-size: 16px; }
  .contact-line .cl-v { flex: 1; margin-left: 8px; }
  .contact-line .cl-a { color: #185FA5; flex-shrink: 0; cursor: pointer; }

  /* ===== 商品详情 ===== */
  .detail { position: fixed; top: 0; left: 0; right: 0; bottom: 0; max-width: 540px; margin: 0 auto;
            background: #F5F3F0; z-index: 40; transform: translateX(100%); transition: transform .28s ease;
            display: flex; flex-direction: column; }
  .detail.show { transform: translateX(0); }
  .detail-bar { height: 46px; flex-shrink: 0; display: flex; align-items: center;
                padding: 0 12px; background: #fff; border-bottom: 1px solid #EFEDE8; }
  .detail-bar .back { font-size: 22px; cursor: pointer; padding: 4px 10px 4px 2px; color: #2C2B29; line-height: 1; }
  .detail-bar .close { margin-left: auto; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 10px; color: #2C2B29; }
  .detail-bar .dt { font-size: 15px; font-weight: 600; }
  .detail-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .d-img { width: 100%; height: 240px; background: #E7DEDC; display: flex;
           align-items: center; justify-content: center; color: #fff; font-size: 48px; }
  .d-img img { width: 100%; height: 100%; object-fit: cover; }
  .d-thumbs { display: flex; gap: 6px; padding: 10px 16px 0; }
  .d-thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
  .d-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .d-thumb.on { border-color: #8B2E2E; }
  .d-info { background: #fff; padding: 16px; }
  .d-name { font-size: 18px; font-weight: 700; }
  .d-price { color: #8B2E2E; font-size: 24px; font-weight: 700; margin-top: 8px; }
  .d-price.ask { font-size: 20px; }
  .d-price .cny { font-size: 14px; }
  .d-spec { color: #9A938A; font-size: 13px; margin-top: 4px; }
  .d-desc { color: #5F5E5A; font-size: 14px; line-height: 1.7; margin-top: 12px; white-space: pre-wrap; }
  .d-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .d-tags span { font-size: 11px; color: #8B2E2E; background: #FBEFEF; border-radius: 5px; padding: 3px 8px; }
  .detail-foot { flex-shrink: 0; display: flex; gap: 10px; padding: 10px 16px;
                 background: #fff; border-top: 1px solid #EFEDE8; }
  .detail-foot button { flex: 1; border: none; border-radius: 22px; padding: 12px;
                        font-size: 15px; font-weight: 600; cursor: pointer; }
  .bf-call { background: #8B2E2E; color: #fff; }
  .bf-wx { background: #F2DEDE; color: #8B2E2E; }

  /* ===== 底部 tab ===== */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; max-width: 540px; margin: 0 auto;
            height: 56px; display: flex; background: #fff; border-top: 1px solid #EFEDE8; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center;
         justify-content: center; font-size: 11px; color: #9A938A; cursor: pointer; gap: 2px; }
  .tab .ti { font-size: 20px; line-height: 1; }
  .tab.on { color: #8B2E2E; }

  /* ===== toast ===== */
  .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
           background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 10px 18px;
           border-radius: 10px; z-index: 90; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; text-align: center; }
  .toast.show { opacity: 1; }

            <span class="pc-value" id="pc-phone-v"></span>
            <span class="pc-act accent" onclick="callPhone()">拨打</span>
          </div>
        </div>
      </div>

      <div class="notice" id="notice" style="display:none">
        <span>📢</span><span id="notice-text"></span>
      </div>

      <div class="cats" id="cats"></div>

      <div class="search">
        <input type="text" id="search" placeholder="搜索商品名称…" oninput="renderProducts()"/>
      </div>

      <div class="sec-title">全部商品</div>
      <div class="grid" id="grid"></div>
      <div class="list-end">— 没有更多了 —</div>
    </div>

    <!-- 联系页 -->
    <div class="page page-contact" id="page-contact" style="display:none">
      <div class="contact-card">
        <div class="contact-head">
          <div class="avatar" id="cc-avatar"></div>
          <div class="pc-main">
            <div class="pc-name" id="cc-name"></div>
            <div class="pc-tag" id="cc-tag"></div>
          </div>
        </div>
        <div style="height:10px"></div>
        <div class="contact-line" id="cl-wechat">
          <span class="cl-ic">💬</span><span class="cl-v" id="cl-wechat-v"></span>
          <span class="cl-a" onclick="copyWechat()">复制</span>
        </div>
        <div class="contact-line" id="cl-phone">
          <span class="cl-ic">📞</span><span class="cl-v" id="cl-phone-v"></span>
          <span class="cl-a" onclick="callPhone()">拨打</span>
        </div>
        <div class="contact-line" id="cl-address">
          <span class="cl-ic">📍</span><span class="cl-v" id="cl-address-v"></span>
        </div>
        <div class="contact-line" id="cl-hours">
          <span class="cl-ic">🕐</span><span class="cl-v" id="cl-hours-v"></span>
        </div>
      </div>
    </div>

    <!-- 商品详情 -->
    <div class="detail" id="detail">
      <div class="detail-bar">
        <span class="back" onclick="closeDetail()">‹</span>
        <span class="dt">商品详情</span>
        <span class="close" onclick="closeDetail()">×</span>
      </div>
      <div class="detail-body">
        <div class="d-img" id="d-img"></div>
        <div id="d-thumbs-box"></div>
        <div class="d-info">
          <div class="d-name" id="d-name"></div>
          <div id="d-price-box"></div>
          <div class="d-spec" id="d-spec"></div>
          <div class="d-tags" id="d-tags"></div>
          <div class="d-desc" id="d-desc"></div>
        </div>
      </div>
      <div class="detail-foot">
        <button class="bf-call" onclick="callPhone()">拨打电话</button>
        <button class="bf-wx" onclick="copyWechat()">复制微信</button>
      </div>
    </div>

    <!-- 底部 tab -->
    <div class="tabbar">
      <div class="tab on" data-tab="home" onclick="switchTab('home')">
        <span class="ti">🏠</span><span>首页</span>
      </div>
      <div class="tab" data-tab="contact" onclick="switchTab('contact')">
        <span class="ti">👤</span><span>联系</span>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

      "categoryId": "cat_yangjiu",
      "price": 0,
      "unit": "瓶",
      "spec": "700ml · 干邑",
      "desc": "价格随行情浮动\n详询店家",
      "images": [],
      "tags": [],
      "onSale": true,
      "sort": 13
    }
  ]
};

let DATA = null;
let activeCat = '';     // 空 = 全部
let bannerIdx = 0, bannerTimer = null;
let detailOpen = false;
let pushedState = false;

/* ============ 取数 ============ */
async function load() {
  try {
    const r = await fetch('./data.json?_t=' + Date.now());
    if (!r.ok) throw 0;
    DATA = await r.json();
  } catch (e) {
    DATA = JSON.parse(JSON.stringify(FALLBACK));
    toast('未读到线上数据，显示的是示例内容');
  }
  if (DATA.profile && DATA.profile.name) document.title = DATA.profile.name;
  renderAll();
}

/* ============ 工具 ============ */
function catName(id) {
  const c = (DATA.categories || []).find(x => x.id === id);
  return c ? c.name : '未分类';
}
function catIcon(id) {
  const c = (DATA.categories || []).find(x => x.id === id);
  return c ? c.icon : '🏷️';
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(t) {
  const e = document.getElementById('toast');
  e.textContent = t; e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 1600);
}

/* ============ 渲染：全部 ============ */
function renderAll() {
  renderBanner();
  renderProfile();
  renderNotice();
  renderCats();
  renderProducts();
}

/* ============ 轮播 ============ */
function renderBanner() {
  const banners = (DATA.banners || []).filter(b => b.onSale !== false);
  const track = document.getElementById('banner-track');
  const dots = document.getElementById('banner-dots');
  if (!banners.length) { track.parentElement.style.display = 'none'; return; }
  track.parentElement.style.display = '';
  track.innerHTML = banners.map(b => {
    const bg = b.image
      ? `<img src="${esc(b.image)}" alt=""/>`
      : `<div style="position:absolute;inset:0;background:linear-gradient(135deg,${esc(b.color||'#8B2E2E')},${esc(shade(b.color||'#8B2E2E',-25))})"></div>`;
    return `<div class="slide">${bg}<div class="s-title">${esc(b.title)}</div><div class="s-sub">${esc(b.subtitle||'')}</div></div>`;
  }).join('');
  dots.innerHTML = banners.map((_, i) => `<i class="${i===0?'on':''}"></i>`).join('');
  bannerIdx = 0;
  clearInterval(bannerTimer);
  if (banners.length > 1) {
    bannerTimer = setInterval(() => {
      bannerIdx = (bannerIdx + 1) % banners.length;
      track.style.transform = 'translateX(-' + (bannerIdx*100) + '%)';
      var ch = dots.children;
      for (var i=0;i<ch.length;i++) ch[i].className = i === bannerIdx ? 'on' : '';
    }, 3500);
  }
}
function shade(hex, amt) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return '#5a1d1d';
  const c = m.slice(1).map(x => Math.max(0, Math.min(255, parseInt(x,16) + amt)));
  return '#' + c.map(x => x.toString(16).padStart(2,'0')).join('');
}

/* ============ 名片卡 ============ */
function renderProfile() {
  const p = DATA.profile || {};
  document.getElementById('pc-name').textContent = p.name || '商品展示';
  document.getElementById('pc-tag').textContent = p.tagline || '';
  const av = document.getElementById('pc-avatar');
  if (p.avatar) av.innerHTML = '<img src="' + esc(p.avatar) + '" alt=""/>';
  else av.textContent = (p.name || '店').slice(0, 1);
  document.getElementById('pc-wechat-v').textContent = p.wechat || '—';
  document.getElementById('pc-phone-v').textContent = p.phone || '—';
  document.getElementById('cc-name').textContent = p.name || '商品展示';
  document.getElementById('cc-tag').textContent = p.tagline || '';
  const ccav = document.getElementById('cc-avatar');
  if (p.avatar) ccav.innerHTML = '<img src="' + esc(p.avatar) + '" alt=""/>';
  else ccav.textContent = (p.name || '店').slice(0, 1);
  document.getElementById('cl-wechat-v').textContent = p.wechat || '—';
  document.getElementById('cl-phone-v').textContent = p.phone || '—';
  document.getElementById('cl-address-v').textContent = p.address || '—';
  document.getElementById('cl-hours-v').textContent = p.hours || '—';
}

/* ============ 公告 ============ */
function renderNotice() {
  const n = DATA.profile && DATA.profile.notice;
  const box = document.getElementById('notice');
  if (n) { box.style.display = 'flex'; document.getElementById('notice-text').textContent = n; }
  else box.style.display = 'none';
}

/* ============ 分类 ============ */
function renderCats() {
  const cats = (DATA.categories || []).filter(c => c.onSale !== false);
  const box = document.getElementById('cats');
  let html = '<div class="cat ' + (activeCat===''?'active':'') + '" onclick="setCat(\'\')">' +
                '<div class="c-ic">🛒</div><div class="c-nm">全部</div></div>';
  html += cats.map(c => {
    const ic = c.iconImg
      ? '<img src="' + esc(c.iconImg) + '" alt=""/>'
      : esc(c.icon || '🏷️');
    return '<div class="cat ' + (activeCat===c.id?'active':'') + '" onclick="setCat(\'' + esc(c.id) + '\')">' +
                '<div class="c-ic">' + ic + '</div><div class="c-nm">' + esc(c.name) + '</div></div>';
  }).join('');
  box.innerHTML = html;
}
function setCat(id) { activeCat = id; renderCats(); renderProducts(); }

/* ============ 商品 ============ */
function renderProducts() {
  const kw = (document.getElementById('search').value || '').trim().toLowerCase();
  let list = (DATA.products || []).filter(p => p.onSale !== false);
  if (activeCat) list = list.filter(p => p.categoryId === activeCat);
  if (kw) list = list.filter(p => (p.name || '').toLowerCase().indexOf(kw) > -1);
  /* 按数组顺序展示（与后台管理顺序一致） */

  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = '<div class="empty" style="width:100%">没有符合条件的商品</div>'; return; }

  grid.innerHTML = list.map(p => {
    const img = (p.images && p.images[0])
      ? '<img src="' + esc(p.images[0]) + '" alt=""/>'
      : '<span>' + esc(catIcon(p.categoryId)) + '</span>';
    const tags = (p.tags || []).slice(0, 2).map(t => '<span>' + esc(t) + '</span>').join('');
    const priceHtml = (p.price > 0)
      ? '<span class="price"><span class="cny">¥</span>' + p.price + '</span><span class="unit">/' + esc(p.unit||'件') + '</span>'
      : '<span class="price ask">面议</span>';
    return '<div class="goods" onclick="openDetail(\'' + esc(p.id) + '\')">' +
      '<div class="g-inner">' +
        '<div class="g-img">' + img + (tags ? '<div class="g-tags">' + tags + '</div>' : '') + '</div>' +
        '<div class="g-body">' +
          '<div class="g-name">' + esc(p.name) + '</div>' +
          '<div class="g-cat">' + esc(catName(p.categoryId)) + '</div>' +
          '<div class="g-foot">' + priceHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ============ 详情 ============ */
function openDetail(id) {
  const p = (DATA.products || []).find(x => x.id === id);
  if (!p) return;
  if (!detailOpen) {
    detailOpen = true;
    try { history.pushState({ shopDetail: true }, '', '#detail'); pushedState = true; }
    catch (e) { location.hash = 'detail'; pushedState = true; }
  }
  const imgs = p.images || [];
  const first = imgs[0]
    ? '<img src="' + esc(imgs[0]) + '" alt=""/>'
    : '<span>' + esc(catIcon(p.categoryId)) + '</span>';
  let thumbs = '';
  if (imgs.length > 1) {
    thumbs = '<div class="d-thumbs">' + imgs.map((u, k) =>
      '<div class="d-thumb ' + (k === 0 ? 'on' : '') + '" onclick="switchDetailImg(this,\'' + esc(u) + '\')"><img src="' + esc(u) + '" alt=""/></div>'
    ).join('') + '</div>';
  }
  const priceHtml = (p.price > 0)
    ? '<span class="d-price"><span class="cny">¥</span>' + p.price + '<span style="font-size:13px;font-weight:400"> /' + esc(p.unit||'件') + '</span></span>'
    : '<span class="d-price ask">面议</span>';
  document.getElementById('d-img').innerHTML = first;
  document.getElementById('d-thumbs-box').innerHTML = thumbs;
  document.getElementById('d-name').textContent = p.name;
  document.getElementById('d-price-box').innerHTML = priceHtml;
  document.getElementById('d-spec').textContent = p.spec || '';
  document.getElementById('d-tags').innerHTML = (p.tags || []).map(t => '<span>' + esc(t) + '</span>').join('');
  document.getElementById('d-desc').textContent = p.desc || '暂无介绍';
  document.getElementById('detail').classList.add('show');
}
function switchDetailImg(el, url) {
  document.getElementById('d-img').innerHTML = '<img src="' + esc(url) + '" alt=""/>';
  const ch = document.querySelectorAll('.d-thumb');
  for (let i = 0; i < ch.length; i++) ch[i].classList.toggle('on', ch[i] === el);
}
function closeDetail() {
  if (!detailOpen) return;
  detailOpen = false;
  document.getElementById('detail').classList.remove('show');
  // 若本页是靠自己压入的历史条目（#detail），退回它，避免多出一条空历史
  if (pushedState) { pushedState = false; history.back(); }
}
/* 手机返回键：只关闭详情、停留在商品列表，不会退出网页 */
function onHistChange() {
  pushedState = false;
  if (!detailOpen) return;
  detailOpen = false;
  document.getElementById('detail').classList.remove('show');
}
window.addEventListener('popstate', onHistChange);
window.addEventListener('hashchange', onHistChange);

/* ============ tab 切换 ============ */
function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab');
  for (let i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === tab);
  document.getElementById('page-home').style.display = tab === 'home' ? '' : 'none';
  document.getElementById('page-contact').style.display = tab === 'contact' ? '' : 'none';
  if (tab === 'contact') closeDetail();
}

/* ============ 拨号 / 复制 ============ */
function callPhone() {
  const phone = (DATA.profile && DATA.profile.phone) || '';
  if (!phone) return toast('未设置电话');
  window.location.href = 'tel:' + phone;
}
function copyWechat() {
  const wx = (DATA.profile && DATA.profile.wechat) || '';
  if (!wx) return toast('未设置微信号');
  const done = () => toast('已复制：' + wx);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(wx).then(done, function(){ fallbackCopy(wx, done); });
  } else fallbackCopy(wx, done);
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('复制失败，请手动复制：' + text); }
  document.body.removeChild(ta);
}

load();
</script>
